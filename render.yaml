# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Deux environnements. MongoDB n'est pas proposé par Render : coller MONGODB_URI
# tel qu'Atlas le fournit. Le serveur ajoute MONGO_DB_NAME.
# Le déploiement attend un pipeline GitHub Actions vert (checksPass).

projects:
  - name: exam-practice-tasks
    environments:
      - name: qualification
        networking:
          isolation: enabled
        services:
          - type: web
            name: exam-practice-api
            runtime: node
            plan: free
            region: frankfurt
            branch: pre-production
            rootDir: backend
            buildCommand: npm ci --omit=dev
            startCommand: node server.js
            healthCheckPath: /api/health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - backend/**
                - render.yaml
            envVars:
              - key: NODE_VERSION
                value: "20"
              - key: NODE_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: LOG_TO_FILE
                value: "false"
              - key: JWT_SECRET
                generateValue: true
              - key: MONGODB_URI
                sync: false
              - key: MONGO_DB_NAME
                value: exam_practice_preprod
              - key: CORS_ORIGIN
                fromService:
                  name: exam-practice-web
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

          - type: web
            name: exam-practice-web
            runtime: static
            branch: pre-production
            rootDir: frontend
            buildCommand: npm install && npm run build
            staticPublishPath: ./build
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - frontend/**
                - render.yaml
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Referrer-Policy
                value: no-referrer
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            envVars:
              - key: NODE_VERSION
                value: "20"
              - key: CI
                value: "false"
              - key: REACT_APP_API_URL
                fromService:
                  name: exam-practice-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

      - name: production
        networking:
          isolation: enabled
        services:
          - type: web
            name: exam-practice-api-prod
            runtime: node
            plan: starter
            region: frankfurt
            branch: production
            rootDir: backend
            buildCommand: npm ci --omit=dev
            startCommand: node server.js
            healthCheckPath: /api/health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - backend/**
                - render.yaml
            envVars:
              - key: NODE_VERSION
                value: "20"
              - key: NODE_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: LOG_TO_FILE
                value: "false"
              - key: JWT_SECRET
                generateValue: true
              - key: MONGODB_URI
                sync: false
              - key: MONGO_DB_NAME
                value: exam_practice_prod
              - key: CORS_ORIGIN
                fromService:
                  name: exam-practice-web-prod
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

          - type: web
            name: exam-practice-web-prod
            runtime: static
            branch: production
            rootDir: frontend
            buildCommand: npm install && npm run build
            staticPublishPath: ./build
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - frontend/**
                - render.yaml
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Referrer-Policy
                value: no-referrer
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            envVars:
              - key: NODE_VERSION
                value: "20"
              - key: CI
                value: "false"
              - key: REACT_APP_API_URL
                fromService:
                  name: exam-practice-api-prod
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
