# CI sur chaque pull request et sur develop / main.
# CD :
#   - branche develop  → environnement GitHub « preproduction » (tag d'image : preprod)
#   - branche main     → environnement GitHub « production » (tag d'image : prod)
#   - workflow_dispatch → redéploie la branche choisie vers l'environnement indiqué
#
# Secrets de l'environnement (preproduction et production, valeurs distinctes) :
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, JWT_SECRET
# Variables de l'environnement :
#   CORS_ORIGIN (obligatoire pour déployer), HTTP_PORT (facultatif), APP_URL (facultatif)
# Tant que les secrets ou CORS_ORIGIN manquent, les images sont publiées et le déploiement est ignoré.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: Environnement à déployer
        type: choice
        options:
          - preproduction
          - production
        default: preproduction

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Tests et validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances du backend
        working-directory: backend
        run: npm ci

      - name: Lancer les tests
        working-directory: backend
        run: npm test

      - name: Auditer les dépendances du backend
        working-directory: backend
        run: npm audit --audit-level=moderate

      - name: Vérifier le script de déploiement
        run: bash -n deploy/deploy.sh

      - name: Vérifier le fichier Compose de déploiement
        env:
          BACKEND_IMAGE: ghcr.io/example/backend:ci
          FRONTEND_IMAGE: ghcr.io/example/frontend:ci
          JWT_SECRET: abcdefghijklmnopqrstuvwxyz012345
          CORS_ORIGIN: http://127.0.0.1:8080
          HTTP_PORT: "8080"
        run: docker compose -f deploy/docker-compose.yml config >/dev/null

  images:
    name: Construire les images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_sha }}
      frontend_image: ${{ steps.meta.outputs.frontend_sha }}
      backend_channel: ${{ steps.meta.outputs.backend_image }}
      frontend_channel: ${{ steps.meta.outputs.frontend_image }}
      environment_name: ${{ steps.meta.outputs.environment_name }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déterminer l'environnement et les tags
        id: meta
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short="$(git rev-parse --short HEAD)"
          push=false
          environment_name=ci
          channel=ci

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_TARGET" in
              production|preproduction) environment_name="$INPUT_TARGET" ;;
              *)
                echo "Cible inconnue : ${INPUT_TARGET}" >&2
                exit 1
                ;;
            esac
            push=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            environment_name=production
            push=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            environment_name=preproduction
            push=true
          fi

          case "$environment_name" in
            production) channel=prod ;;
            preproduction) channel=preprod ;;
            *) channel=ci ;;
          esac

          prefix="ghcr.io/${repo}"
          {
            echo "push=${push}"
            echo "environment_name=${environment_name}"
            echo "backend_image=${prefix}/backend:${channel}"
            echo "frontend_image=${prefix}/frontend:${channel}"
            echo "backend_sha=${prefix}/backend:sha-${short}"
            echo "frontend_sha=${prefix}/frontend:sha-${short}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Images"
            echo ""
            echo "- Environnement : \`${environment_name}\`"
            echo "- Publication : \`${push}\`"
            echo "- Backend : \`${prefix}/backend:${channel}\` et \`${prefix}/backend:sha-${short}\`"
            echo "- Frontend : \`${prefix}/frontend:${channel}\` et \`${prefix}/frontend:sha-${short}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ steps.meta.outputs.push == 'true' }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.meta.outputs.backend_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Construire l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ steps.meta.outputs.push == 'true' }}
          provenance: false
          build-args: |
            REACT_APP_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.meta.outputs.frontend_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Déployer
    needs: images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.images.outputs.environment_name }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la configuration de l'environnement
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY JWT_SECRET CORS_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} n'est pas défini sur l'environnement ${{ needs.images.outputs.environment_name }}"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Déploiement ignoré : les images sont publiées, le serveur n'est pas configuré." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copier la stack et démarrer les conteneurs
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          HTTP_PORT: ${{ vars.HTTP_PORT }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
          ENVIRONMENT: ${{ needs.images.outputs.environment_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          remote="/opt/exam-practice/${ENVIRONMENT}"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -p "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$remote'"
          scp -i "$HOME/.ssh/deploy_key" -P "$port" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml deploy/deploy.sh \
            "${target}:${remote}/"

          {
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'CORS_ORIGIN=%s\n' "$CORS_ORIGIN"
            printf 'ENVIRONMENT=%s\n' "$ENVIRONMENT"
            if [ -n "$HTTP_PORT" ]; then
              printf 'HTTP_PORT=%s\n' "$HTTP_PORT"
            fi
          } | ssh "${ssh_opts[@]}" "$target" "cat > '$remote/.env' && chmod 600 '$remote/.env'"

          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh "${ssh_opts[@]}" "$target" "bash '$remote/deploy.sh'"

          {
            echo "### Déploiement ${ENVIRONMENT}"
            echo ""
            echo "- Hôte : \`${DEPLOY_HOST}\`"
            echo "- Backend : \`${BACKEND_IMAGE}\`"
            echo "- Frontend : \`${FRONTEND_IMAGE}\`"
            echo "- Canal : \`${{ needs.images.outputs.backend_channel }}\` et \`${{ needs.images.outputs.frontend_channel }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
