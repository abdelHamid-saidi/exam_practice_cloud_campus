# Pipeline de pré-production (branche pre-production) et de production (branche production).
# Render ne déploie qu'une fois ce workflow vert : autoDeployTrigger vaut checksPass.

name: CI/CD

on:
  pull_request:
    branches:
      - pre-production
      - production
  push:
    branches:
      - pre-production
      - production

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Tests API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Auditer les dépendances
        run: npm run audit

  test-frontend:
    name: Tests interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Construire l'interface
        run: npm run build
        env:
          CI: true

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Nom des images
        id: images
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${owner}/exam-practice-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/exam-practice-web" >> "$GITHUB_OUTPUT"

      - name: Étiquettes
        id: tags
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          write_tags() {
            local image="$1"
            local output="$2"
            {
              echo "${output}<<EOF"
              echo "${image}:${GITHUB_SHA}"
              if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                echo "${image}:${GITHUB_REF_NAME}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }
          write_tags "${API_IMAGE}" api
          write_tags "${WEB_IMAGE}" web

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image de l'API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.api }}

      - name: Construire l'image de l'interface
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
          build-args: |
            REACT_APP_API_URL=/api
          tags: ${{ steps.tags.outputs.web }}
